<!DOCTYPE html>
<html lang=en>
<head>
  <meta charset=UTF-8>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      background: transparent;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Inter, sans-serif;
      user-select: none;
      -webkit-app-region: drag;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .splash-container {
      width: 480px;
      height: 350px;
      background: linear-gradient(145deg, #0d2112, #071521);
      border: 1.5px solid rgba(134, 239, 172, 0.4);
      border-radius: 28px;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.75), 0 0 40px rgba(74, 222, 128, 0.15);
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 28px 24px;
      text-align: center;
    }
    .glow-circle {
      position: absolute;
      top: -60px;
      width: 280px;
      height: 280px;
      background: radial-gradient(circle, rgba(74, 222, 128, 0.22) 0%, transparent 70%);
      pointer-events: none;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 14px;
      border-radius: 9999px;
      background: rgba(74, 222, 128, 0.12);
      border: 1px solid rgba(74, 222, 128, 0.35);
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: #86efac;
      margin-bottom: 18px;
      font-family: ui-monospace, SFMono-Regular, JetBrains Mono, monospace;
    }
    .badge::before {
      content: ";
 width: 6px;
 height: 6px;
 border-radius: 50%;
 background: #4ade80;
 box-shadow: 0 0 8px #4ade80;
 }
 .icon-wrapper {
 position: relative;
 width: 72px;
 height: 72px;
 margin-bottom: 14px;
 display: flex;
 align-items: center;
 justify-content: center;
 }
 .pulse-ring {
 position: absolute;
 inset: -6px;
 border-radius: 24px;
 border: 2px solid rgba(74, 222, 128, 0.3);
 animation: pulse 2.2s infinite ease-out;
 }
 .icon-box {
 width: 64px;
 height: 64px;
 border-radius: 20px;
 background: linear-gradient(135deg, #1f4e2b, #0d2818);
 border: 1.5px solid #86efac;
 box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
 display: flex;
 align-items: center;
 justify-content: center;
 font-size: 28px;
 }
 h1 {
 font-size: 22px;
 font-weight: 800;
 letter-spacing: -0.02em;
 color: #ffffff;
 margin-bottom: 4px;
 text-shadow: 0 2px 10px rgba(0,0,0,0.5);
 }
 p {
 font-size: 12px;
 color: #a5d6a7;
 font-weight: 500;
 margin-bottom: 22px;
 letter-spacing: 0.02em;
 }
 .progress-track {
 width: 290px;
 height: 6px;
 background: rgba(255, 255, 255, 0.08);
 border-radius: 999px;
 overflow: hidden;
 position: relative;
 border: 1px solid rgba(134, 239, 172, 0.25);
 }
 .progress-thumb {
 height: 100%;
 width: 45%;
 background: linear-gradient(90deg, #22c55e, #86efac, #facc15);
 border-radius: 999px;
 animation: sweep 1.5s infinite ease-in-out;
 }
 .status-msg {
 margin-top: 14px;
 font-size: 11px;
 font-family: ui-monospace, SFMono-Regular, JetBrains Mono, monospace;
 color: #86efac;
 letter-spacing: 0.08em;
 font-weight: 700;
 min-height: 16px;
 }
 @keyframes pulse {
 0% { transform: scale(0.92); opacity: 0.9; }
 100% { transform: scale(1.35); opacity: 0; }
 }
 @keyframes sweep {
 0% { transform: translateX(-100%); width: 30%; }
 50% { width: 60%; }
 100% { transform: translateX(260%); width: 30%; }
 }
 </style>
</head>
<body>
 <div class=splash-container>
 <div class=glow-circle></div>
 <span class=badge>NATIVE DESKTOP ENVIRONMENT</span>
 <div class=icon-wrapper>
 <div class=pulse-ring></div>
 <div class=icon-box>🛡️</div>
 </div>
 <h1>SAT FOCUS GUARD</h1>
 <p>Authentic Digital SAT Prep &bull; Khan Academy Syllabi</p>
 <div class=progress-track>
 <div class=progress-thumb></div>
 </div>
 <div class=status-msg id=status>STARTING STUDY WORKSPACE...</div>
 </div>

 <script>
 const steps = [
 STARTING STUDY WORKSPACE...,
 SYNCING 55-DAY MASTER BLUEPRINT...,
 LOADING KHAN ACADEMY CURRICULUM...,
 INITIALIZING BOTANICAL FOCUS ENGINE...,
 CONNECTING TO PORT 3000...
 ];
 let idx = 0;
 setInterval(() => {
 idx = (idx + 1) % steps.length;
 document.getElementById('status').innerText = steps[idx];
 }, 1100);
 </script>
</body>
</html>
